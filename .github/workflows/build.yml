
name: Build Nebula APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            ls -la
            exit 1
          fi
          mkdir -p project
          unzip "$ZIP_FILE" -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle -p project --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-Rapid-Touch-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
